<!doctype html>
<html><head><meta charset="utf-8"><title>Code Manager – Design Mockup</title>
<style>
:root{--blue:#2271b1;--ink:#1d2327;--mut:#646970;--line:#dcdcde;--bg:#f0f0f1;--brand:#4f46e5;--brand2:#7c3aed;--ok:#00a32a;--warn:#dba617;--err:#d63638}
*{box-sizing:border-box}body{margin:0;font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.bar{height:32px;background:#1d2327;color:#c3c4c7;display:flex;align-items:center;padding:0 14px;gap:18px;font-size:13px}
.bar b{color:#fff}.bar .r{margin-left:auto}
.wrap{display:flex;min-height:calc(100vh - 32px)}
.side{width:160px;background:#1d2327;color:#c3c4c7;padding-top:8px;flex:none}
.side div{padding:8px 12px}.side .on{background:var(--blue);color:#fff}.side .sub{background:#2c3338;padding:4px 0}.side .sub div{padding:4px 12px 4px 20px;font-size:13px}.side .sub .cur{color:#fff;font-weight:600}
.main{flex:1;padding:20px 24px;max-width:1180px}
.hero{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:10px;padding:18px 22px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.logo{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font:700 20px monospace}
.hero h1{margin:0;font-size:22px;color:#fff}.hero p{margin:2px 0 0;opacity:.9}
.hero .by{margin-left:auto;text-align:right;font-size:12px}.hero .by a{color:#fff;font-weight:600}
.btn{display:inline-block;border-radius:4px;padding:6px 14px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-size:13px}
.btn.s{background:#f6f7f7;color:var(--blue)}.btn.w{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs span{padding:9px 14px;color:var(--mut);border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;font-weight:500}
.tabs .t{background:#fff;color:var(--brand);border-color:var(--line);margin-bottom:-1px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:15px}.card .d{color:var(--mut);margin:0 0 12px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
textarea,.code{width:100%;font:12px/1.6 Menlo,Consolas,monospace;background:#1e1e2e;color:#cdd6f4;border:0;border-radius:6px;padding:12px;min-height:130px;white-space:pre;overflow:hidden}
.code .c{color:#6c7086}.code .k{color:#cba6f7}.code .s{color:#a6e3a1}.code .f{color:#89b4fa}
input.i,select.i{width:100%;padding:6px 8px;border:1px solid #8c8f94;border-radius:4px;background:#fff;font-size:13px;height:32px}
label.l{display:block;font-weight:600;margin:0 0 4px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f0f1}th{background:#f6f7f7;font-weight:600;color:#50575e;border-bottom:1px solid var(--line)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.php{background:#e8e4fb;color:#5b3fc4}.js{background:#fff3c4;color:#8a6d00}.css{background:#d9edff;color:#0a5aa8}.html{background:#ffe3d6;color:#b24a14}.txt{background:#e6e6e6;color:#444}
.tg{display:inline-block;width:34px;height:18px;border-radius:99px;background:#ccc;position:relative;vertical-align:middle}.tg:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}.tg.on{background:var(--ok)}.tg.on:after{left:18px}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--mut)}
.rule{display:flex;gap:8px;align-items:center;margin-bottom:8px}.rule .i{flex:1}
.note{border-left:4px solid var(--ok);background:#f0fbf3;padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:10px}
.note.w{border-color:var(--warn);background:#fff8e5}.note.e{border-color:var(--err);background:#fdf0f0}
.foot{margin-top:18px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:12px;color:var(--mut)}
.foot b{color:var(--ink)}.foot a{color:var(--brand);font-weight:600}.foot .r{margin-left:auto}
.diff .a{background:#e6ffec;color:#116329}.diff .d{background:#ffebe9;color:#82071e}
.pg{display:none}.pg.show{display:block}
.sw{display:flex;gap:8px;align-items:center}
</style></head><body>
<div class="bar"><b>⌂ Client Site</b><span>+ New</span><span class="r">Howdy, Admin</span></div>
<div class="wrap">
<div class="side"><div>Dashboard</div><div>Posts</div><div>Pages</div><div>Appearance</div><div>Plugins</div><div>Users</div><div>Tools</div>
<div class="on">Settings</div><div class="sub"><div>General</div><div>Writing</div><div>Reading</div><div class="cur">Code Manager</div></div></div>
<div class="main" id="app"></div></div>

<script>
const TABS=[["headers","Headers & Footers"],["snippets","Snippets"],["edit","Add / Edit Snippet"],["conditions","Conditional Logic"],["library","Library & Generator"],["revisions","Revisions & Schedule"],["tools","Import / Export"],["logs","Error Log & Audit"],["settings","Settings & Security"],["support","Support"]];
const code=(s)=>`<div class="code">${s}</div>`;
const pages={
headers:`<div class="grid g2" style="grid-template-columns:2fr 1fr">
<div>
<div class="card"><h2>Header</h2><p class="d">Printed just before <code>&lt;/head&gt;</code> on every page. Perfect for analytics, meta tags and pixels.</p>${code('<span class="c">&lt;!-- Google tag --&gt;</span>\n&lt;script async src=<span class="s">"https://www.googletagmanager.com/gtag/js?id=G-XXXX"</span>&gt;&lt;/script&gt;\n&lt;script&gt;window.dataLayer=[];&lt;/script&gt;')}</div>
<div class="card"><h2>Body</h2><p class="d">Printed right after the opening <code>&lt;body&gt;</code> tag.</p>${code('<span class="c">&lt;!-- GTM noscript --&gt;</span>')}</div>
<div class="card"><h2>Footer</h2><p class="d">Printed before <code>&lt;/body&gt;</code>.</p>${code('<span class="c">&lt;!-- Chat widget --&gt;</span>')}</div>
<span class="btn">Save Changes</span></div>
<div><div class="card"><h2>Quick integrations</h2><p class="d">Paste an ID, we generate safe code.</p>
<label class="l">Google Analytics (GA4)</label><input class="i" value="G-AB12CD34EF"><br><br>
<label class="l">Google Tag Manager</label><input class="i" value="GTM-XXXXXXX"><br><br>
<label class="l">Meta (Facebook) Pixel</label><input class="i" placeholder="Pixel ID"><br><br>
<label class="l">TikTok Pixel</label><input class="i" placeholder="Pixel ID"></div>
<div class="card"><h2>Who can edit?</h2><div class="note">Only users with <b>Code Manager</b> capability. Currently: Administrators.</div></div></div></div>`,
snippets:`<div class="grid g4" style="margin-bottom:14px"><div class="card stat"><b>24</b><span>Total snippets</span></div><div class="card stat"><b style="color:var(--ok)">19</b><span>Active</span></div><div class="card stat"><b style="color:var(--warn)">3</b><span>Scheduled</span></div><div class="card stat"><b style="color:var(--err)">1</b><span>Auto-disabled (error)</span></div></div>
<div class="sw" style="margin-bottom:10px"><span class="btn">+ Add Snippet</span><span class="btn s">Bulk actions ▾</span><input class="i" style="width:240px;margin-left:auto" placeholder="Search snippets…"><select class="i" style="width:140px"><option>All types</option></select></div>
<table><tr><th>☐</th><th>Title</th><th>Type</th><th>Location</th><th>Conditions</th><th>Priority</th><th>Status</th></tr>
<tr><td>☐</td><td><b>Hide admin bar for clients</b><br><small style="color:var(--mut)">Edit · Duplicate · Revisions · Delete</small></td><td><span class="pill php">PHP</span></td><td>Run everywhere</td><td>Role ≠ Administrator</td><td>10</td><td><span class="tg on"></span></td></tr>
<tr><td>☐</td><td><b>Facebook Pixel</b></td><td><span class="pill js">JS</span></td><td>Site-wide header</td><td>All pages</td><td>10</td><td><span class="tg on"></span></td></tr>
<tr><td>☐</td><td><b>Free shipping banner</b></td><td><span class="pill html">HTML</span></td><td>Before content</td><td>WooCommerce: cart total &lt; $50</td><td>20</td><td><span class="tg on"></span></td></tr>
<tr><td>☐</td><td><b>Custom button styles</b></td><td><span class="pill css">CSS</span></td><td>Site-wide header</td><td>Desktop only</td><td>10</td><td><span class="tg on"></span></td></tr>
<tr><td>☐</td><td><b>Black Friday banner</b> <span class="pill" style="background:#fff3c4;color:#8a6d00">Scheduled</span></td><td><span class="pill html">HTML</span></td><td>After paragraph 2</td><td>Posts</td><td>10</td><td><span class="tg"></span></td></tr>
<tr><td>☐</td><td><b>Legacy redirect</b> <span class="pill" style="background:#fbe0e0;color:#a21c1e">Error – auto-disabled</span></td><td><span class="pill php">PHP</span></td><td>Run everywhere</td><td>—</td><td>5</td><td><span class="tg"></span></td></tr></table>`,
edit:`<div class="grid" style="grid-template-columns:2fr 1fr">
<div><div class="card"><label class="l">Title</label><input class="i" value="Hide admin bar for clients"><br><br>
<div class="sw"><span class="btn" style="background:#5b3fc4;border-color:#5b3fc4">PHP</span><span class="btn s">JavaScript</span><span class="btn s">CSS</span><span class="btn s">HTML</span><span class="btn s">Text</span><span class="btn s">Universal</span></div><br>
${code('<span class="k">add_filter</span>( <span class="s">\'show_admin_bar\'</span>, <span class="k">function</span>( $show ) {\n    <span class="k">return</span> <span class="f">current_user_can</span>( <span class="s">\'manage_options\'</span> );\n} );')}
<div class="note" style="margin-top:10px">✔ Syntax check passed – safe to activate</div></div>
<div class="card"><h2>Smart Conditional Logic</h2><p class="d">Show this snippet only when…</p>
<div class="rule"><select class="i"><option>User role</option></select><select class="i"><option>is not</option></select><select class="i"><option>Administrator</option></select></div>
<span class="btn s">+ AND</span> <span class="btn s">+ OR group</span></div></div>
<div><div class="card"><h2>Publish</h2><div class="sw"><span class="tg on"></span> Active</div><br>
<label class="l">Insert method</label><select class="i"><option>Auto insert</option></select><br><br>
<label class="l">Location</label><select class="i"><option>Run everywhere</option></select><br><br>
<label class="l">Priority</label><input class="i" value="10"><br><br>
<label class="l">Schedule</label><input class="i" placeholder="Start – End date"><br><br>
<span class="btn">Save Snippet</span> <span class="btn s">Save &amp; Activate</span></div>
<div class="card"><h2>Shortcode</h2><code>[cm_snippet id="12"]</code></div></div></div>`,
conditions:`<div class="card"><h2>Conditional Logic Builder</h2><p class="d">Combine rules with AND / OR. Everything below is built in – no upsell.</p>
<div class="note">Show snippet if <b>ALL</b> of the following match:</div>
<div class="rule"><select class="i"><option>Page type</option></select><select class="i"><option>is</option></select><select class="i"><option>Single post</option></select><span class="btn s">✕</span></div>
<div class="rule"><select class="i"><option>Device</option></select><select class="i"><option>is</option></select><select class="i"><option>Mobile</option></select><span class="btn s">✕</span></div>
<div class="rule"><select class="i"><option>WooCommerce: cart total</option></select><select class="i"><option>is greater than</option></select><input class="i" value="50"><span class="btn s">✕</span></div>
<span class="btn s">+ Add rule</span> <span class="btn s">+ Add OR group</span></div>
<div class="grid g3"><div class="card"><h2>Page &amp; content</h2><p class="d">Page type, URL, post type, taxonomy, author, template.</p></div><div class="card"><h2>User &amp; visitor</h2><p class="d">Logged in, role, device, referrer, cookie, country.</p></div><div class="card"><h2>E-commerce &amp; time</h2><p class="d">WooCommerce &amp; EDD cart/product, date &amp; time.</p></div></div>`,
library:`<div class="grid g2"><div class="card"><h2>Local Snippet Library</h2><p class="d">Ready-made snippets stored inside the plugin. No external connection.</p>
<table><tr><td><b>Disable XML-RPC</b><br><span class="pill php">PHP</span></td><td style="text-align:right"><span class="btn s">Use</span></td></tr><tr><td><b>Allow SVG uploads (admins)</b><br><span class="pill php">PHP</span></td><td style="text-align:right"><span class="btn s">Use</span></td></tr><tr><td><b>Disable Gutenberg</b><br><span class="pill php">PHP</span></td><td style="text-align:right"><span class="btn s">Use</span></td></tr><tr><td><b>Cookie consent bar</b><br><span class="pill html">HTML</span></td><td style="text-align:right"><span class="btn s">Use</span></td></tr></table></div>
<div class="card"><h2>Snippet Generator</h2><p class="d">Create common code from a form.</p><label class="l">Generator</label><select class="i"><option>Custom post type</option></select><br><br><label class="l">Name</label><input class="i" value="Portfolio"><br><br><label class="l">Slug</label><input class="i" value="portfolio"><br><br><span class="btn">Generate snippet</span></div></div>`,
revisions:`<div class="grid g2"><div class="card"><h2>Revisions – Hide admin bar for clients</h2><table><tr><th>Date</th><th>By</th><th></th></tr><tr><td>Oct 7, 10:42</td><td>Mudassar</td><td><span class="btn s">Compare</span> <span class="btn s">Restore</span></td></tr><tr><td>Oct 5, 16:10</td><td>Mudassar</td><td><span class="btn s">Compare</span> <span class="btn s">Restore</span></td></tr><tr><td>Oct 1, 09:03</td><td>Admin</td><td><span class="btn s">Compare</span> <span class="btn s">Restore</span></td></tr></table></div>
<div class="card diff"><h2>Compare</h2><div class="code"><div class="d">- return true;</div><div class="a">+ return current_user_can( 'manage_options' );</div></div></div></div>
<div class="card"><h2>Scheduling</h2><div class="grid g2"><div><label class="l">Start</label><input class="i" value="2026-11-25 00:00"></div><div><label class="l">End</label><input class="i" value="2026-12-01 23:59"></div></div></div>`,
tools:`<div class="grid g2"><div class="card"><h2>Export</h2><p class="d">Download snippets as a JSON file.</p><label class="l">Which snippets?</label><select class="i"><option>All (24)</option></select><br><br><span class="btn">Download JSON</span></div>
<div class="card"><h2>Import</h2><p class="d">Upload a JSON file. We validate every field; PHP snippets import <b>inactive</b> until you review them.</p><div style="border:2px dashed var(--line);padding:30px;text-align:center;border-radius:8px;color:var(--mut)">Drop JSON file here (max 2 MB)</div><br><span class="btn">Import</span></div></div>`,
logs:`<div class="grid g2"><div class="card"><h2>Error Log</h2><div class="note e"><b>Legacy redirect</b> – Parse error: unexpected '}' on line 4. Snippet auto-disabled.<br><small>Oct 7, 09:12</small></div><div class="note w">Notice: Undefined variable $post in <b>Free shipping banner</b><br><small>Oct 6, 21:30</small></div></div>
<div class="card"><h2>Audit Log</h2><table><tr><td>Oct 7 10:42</td><td>Mudassar</td><td>edited “Hide admin bar”</td></tr><tr><td>Oct 7 09:10</td><td>Mudassar</td><td>activated “Legacy redirect”</td></tr><tr><td>Oct 6 17:55</td><td>Admin</td><td>imported 6 snippets</td></tr></table></div></div>`,
settings:`<div class="grid g2"><div class="card"><h2>General</h2>
<div class="sw"><span class="tg on"></span> Enable PHP snippets</div><br><div class="sw"><span class="tg"></span> Test mode (disable all snippets for me)</div><br><div class="sw"><span class="tg"></span> Delete all data on uninstall</div><br><div class="sw"><span class="tg on"></span> Auto-disable snippet on fatal error</div><br><span class="btn">Save Settings</span></div>
<div class="card"><h2>Security</h2>
<div class="note">✔ Capability: <code>manage_code_snippets</code> (Administrators)</div>
<div class="note">✔ Nonce &amp; capability on every action</div>
<div class="note">✔ Integrity check: snippets changed outside the plugin are blocked</div>
<div class="note w">Recovery URL for safe mode (keep secret):<br><code>/?cm_safe_mode=••••••••</code> <span class="btn s">Regenerate</span></div></div></div>`,
support:`<div class="grid g2"><div class="card" style="text-align:center;padding:30px"><div class="logo" style="margin:0 auto 10px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff">&lt;/&gt;</div><h2 style="font-size:18px">Code Manager</h2><p class="d">Version 1.0.0 · Built by <b>Mudassar Shakeel</b></p><span class="btn">Contact Support</span> <span class="btn s">Visit mudassar.work</span></div>
<div class="card"><h2>Contact Us</h2><label class="l">Your name</label><input class="i"><br><br><label class="l">Email</label><input class="i"><br><br><label class="l">Message</label><textarea style="background:#fff;color:#000;border:1px solid #8c8f94;min-height:80px"></textarea><br><br><span class="btn">Send message</span><p class="d" style="margin-top:8px">Site info is attached only if you tick the box. Nothing is sent automatically.</p></div></div>`
};
const q=new URLSearchParams(location.search);const cur=q.get('tab')||'headers';
const t=TABS.map(([k,n])=>`<span class="${k==cur?'t':''}">${n}</span>`).join('');
document.getElementById('app').innerHTML=`
<div class="hero"><div class="logo">&lt;/&gt;</div><div><h1>Code Manager</h1><p>Headers, footers and code snippets – safely managed.</p></div>
<div class="by">by <b>Mudassar Shakeel</b><br><a href="#">mudassar.work</a> · <span class="btn w">Contact Us</span></div></div>
<div class="tabs">${t}</div>${pages[cur]}
<div class="foot"><span>Code Manager v1.0.0 · Made by <b>Mudassar Shakeel</b></span><span class="r">Need help? <a href="#">Contact Us</a> · <a href="#">mudassar.work</a></span></div>`;
</script></body></html>
